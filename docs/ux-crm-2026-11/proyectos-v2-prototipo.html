<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos v2 · Prototipo · Muttu Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --rose-50:#FCF1F5;--rose-100:#F9DFE9;--rose-200:#F5BAD2;--rose-300:#F087B2;--rose-400:#EB3F85;--rose-500:#CD1560;--rose-600:#B41153;--rose-700:#940D44;--rose-800:#720B35;
  --ink-50:#FCF9FA;--ink-100:#F7F3F4;--ink-200:#ECE5E7;--ink-300:#DDD2D5;--ink-400:#B09EA3;--ink-500:#8C757B;--ink-600:#725D62;--ink-700:#5A474C;--ink-800:#3F2F33;--ink-900:#281D20;--ink-950:#191113;
  --ok:#127C4A;--ok-bg:#E6F4EC;--warn:#B45309;--warn-bg:#FBF0E1;--bad:#B3261E;--bad-bg:#FBE9E7;--info:#1E5FA8;--info-bg:#EAF1FA;
  --page:#F3EDEF;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink-900);font-family:'Instrument Sans',system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
h1,h2,h3,h4{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;margin:0;letter-spacing:-.01em}
:focus-visible{outline:3px solid rgba(205,21,96,.45);outline-offset:2px}

/* barra del prototipo */
.proto{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:var(--ink-950);color:#F8F2F4;font-size:12.5px}
.proto b{color:var(--rose-200);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11.5px}
.proto .grp{display:flex;align-items:center;gap:6px}
.proto .seg{display:inline-flex;background:#2E2227;border-radius:9px;padding:2px;flex-wrap:wrap}
.proto .seg button{border:0;background:transparent;color:#C4B2B8;padding:4px 10px;border-radius:7px;font-size:12.5px;font-weight:600}
.proto .seg button[aria-pressed="true"]{background:var(--rose-500);color:#fff}
.proto .link{margin-left:auto;border:1px solid #4A3A3F;background:transparent;color:#F8F2F4;border-radius:9px;padding:4px 10px;font-weight:600}

/* shell */
.app{display:flex;gap:14px;padding:14px;flex-wrap:wrap;min-height:calc(100vh - 44px)}
.side{flex:0 0 212px;background:#fff;border:1px solid var(--ink-200);border-radius:26px;padding:14px 12px;display:flex;flex-direction:column;gap:12px;align-self:flex-start;position:sticky;top:58px}
.brand{display:flex;align-items:center;gap:8px;padding:0 6px 10px;border-bottom:1px solid var(--ink-200)}
.brand svg{width:78px;height:auto}
.brand span{font-family:'Bricolage Grotesque';font-weight:700;font-size:15px;color:var(--ink-700)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px;border-radius:10px;color:var(--ink-700);text-decoration:none;font-size:13px;font-weight:500}
.nav a.on{background:var(--rose-50);color:var(--rose-800);font-weight:700;box-shadow:inset 3px 0 0 var(--rose-500)}
.main{flex:999 1 680px;min-width:0;background:#fff;border-radius:26px;padding:22px 26px 40px;display:flex;flex-direction:column;gap:16px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-600)}
.crumbs button{border:0;background:none;padding:0;color:var(--rose-600);font-weight:600}

/* comunes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--ink-300);background:#fff;font-weight:700;font-size:13px;color:var(--ink-900);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--ink-100)}
.btn.pri{background:var(--rose-500);border-color:var(--rose-500);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--rose-600)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.55}
.btn svg{width:15px;height:15px}
.link{border:0;background:none;padding:0;color:var(--rose-600);font-weight:600;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-bad{background:var(--bad-bg);color:var(--bad)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}.t-ink{background:var(--ink-100);color:var(--ink-700)}.t-info{background:var(--info-bg);color:var(--info)}.t-rose{background:var(--rose-50);color:var(--rose-700)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.muted{color:var(--ink-600)}.strong{font-weight:600;color:var(--ink-950)}
.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}.good{color:var(--ok);font-weight:600}
.card{border:1px solid var(--ink-200);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fff;min-width:0}
.card>h3{font-size:15px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card>h3 small{font-family:'Instrument Sans';font-size:12.5px;font-weight:500;color:var(--ink-600)}
.sub{margin:-6px 0 0;font-size:12.5px;color:var(--ink-600)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{border:1px solid var(--ink-200);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff}
.kpi .l{font-size:12.5px;font-weight:600;color:var(--ink-600)}
.kpi .v{font-family:'JetBrains Mono';font-size:24px;font-weight:600;letter-spacing:-.03em;color:var(--ink-950)}
.kpi .v small{font-size:13px;color:var(--ink-600);font-weight:500;letter-spacing:0}
.kpi .d{font-size:12.5px;color:var(--ink-600)}
.kpi.alert{border:1.5px solid var(--bad);background:#FDF3F2}.kpi.alert .l{color:var(--bad)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--ink-100);color:var(--ink-700);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--ink-300);white-space:nowrap;font-size:12.5px}
td{padding:8px 10px;border-bottom:1px solid var(--ink-200);vertical-align:middle}
td.num,th.num{text-align:right}td.num{font-family:'JetBrains Mono';white-space:nowrap}
tr.tot td{font-weight:700;border-top:1.5px solid var(--ink-900);background:var(--ink-50);border-bottom:0}
.bar{position:relative;height:10px;background:var(--ink-100);border-radius:999px;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-900);border-radius:2px}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink-500)}
.seg2{display:inline-flex;background:var(--ink-100);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg2 button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-700)}
.seg2 button[aria-pressed="true"]{background:#fff;color:var(--ink-950);box-shadow:0 1px 2px rgba(40,29,32,.12)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 14px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:#7A3B07}.banner.info{background:var(--info-bg);color:#143F70}.banner.bad{background:var(--bad-bg);color:#7A1A14}.banner.ok{background:var(--ok-bg);color:#0B4F2F}
.new{font-size:10.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;font-family:'Instrument Sans'}
.prop{font-size:10.5px;font-weight:700;color:var(--info);background:var(--info-bg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle;font-family:'Instrument Sans'}
.empty{padding:18px;text-align:center;color:var(--ink-600);font-size:13px;border:1px dashed var(--ink-300);border-radius:14px}

/* portafolio */
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.ph h1{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ph p{margin:6px 0 0;color:var(--ink-600)}
.todo{background:var(--rose-50);border:1px solid var(--rose-100);border-left:4px solid var(--rose-500);border-radius:6px 18px 18px 6px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.todo h3{font-size:15px;color:var(--rose-800)}
.todo .it{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:4px 0}
.todo .it span{flex:1;min-width:0}
.pfil{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{height:36px;border:1px solid var(--ink-300);background:#fff;border-radius:11px;padding:0 10px;font-size:13px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) 120px 140px 150px;gap:12px;align-items:center;border:1px solid var(--ink-200);border-radius:16px;padding:12px 14px;text-align:left;background:#fff;width:100%}
.prow:hover{border-color:var(--rose-200);background:var(--rose-50)}
.prow .nm{font-weight:700;color:var(--ink-950)}
.prow .cd{font-family:'JetBrains Mono';font-size:12px;color:var(--ink-600)}
.prow .nx{font-size:12.5px;color:var(--ink-700)}
.lbl{font-size:11.5px;color:var(--ink-600);display:block;margin-bottom:3px}

/* ficha */
.fh{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--ink-200)}
.fh .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.fh h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.fh .meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--ink-600);align-items:center}
.semchip{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 7px;min-height:30px;padding:4px 12px;text-align:left;border-radius:999px;border:1px solid var(--ink-300);background:#fff;font-size:12.5px;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:44px;z-index:30;background:#fff;border:1px solid var(--ink-200);border-radius:14px;box-shadow:0 12px 30px rgba(25,17,19,.15);padding:6px;min-width:250px;display:none;flex-direction:column}
.menu .pop.on{display:flex}
.menu .pop button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:500;display:flex;justify-content:space-between;gap:10px}
.menu .pop button:hover:not(:disabled){background:var(--ink-100)}
.menu .pop hr{border:0;border-top:1px solid var(--ink-200);margin:4px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink-200);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--ink-600);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink-950);border-bottom-color:var(--rose-500)}
.tabs .cnt{font-size:11px;font-weight:700;background:var(--rose-500);color:#fff;border-radius:999px;padding:0 6px;line-height:18px}
.att{display:flex;flex-direction:column}
.att .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ink-200);font-size:13.5px}
.att .it:last-child{border-bottom:0}
.att .it span{flex:1;min-width:0}
.obj{display:flex;flex-direction:column;gap:8px}
.obj>h4{font-size:14px;color:var(--ink-700);padding:4px 2px}
.act{border:1px solid var(--ink-200);border-radius:16px;background:#fff}
.act.open{border-color:var(--rose-200)}
.act .top{display:grid;grid-template-columns:minmax(0,1.6fr) 120px minmax(160px,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.act .nm{font-weight:700;color:var(--ink-950)}
.act .sm:not(.btn){font-size:12.5px;color:var(--ink-600)}
.act .det{border-top:1px solid var(--ink-200);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.act .det h4{font-size:13.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist .h{display:grid;grid-template-columns:78px 52px minmax(0,1fr);gap:8px;font-size:12.5px;align-items:baseline}
.hist .h.void{opacity:.55;text-decoration:line-through}
.ent{display:flex;flex-direction:column;gap:6px;font-size:13px;padding:8px 10px;border:1px solid var(--ink-200);border-radius:12px}
.ent .r{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hito{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.gantt{overflow-x:auto}
.gantt .g{display:grid;grid-template-columns:220px repeat(30,22px);align-items:center;font-size:12px;min-width:880px}
.gantt .g>div{height:30px;display:flex;align-items:center;border-bottom:1px solid var(--ink-200)}
.gantt .wk{justify-content:center;color:var(--ink-600);font-size:10.5px}
.gantt .cell{position:relative}
.gantt .gb{position:absolute;top:8px;bottom:8px;left:0;right:0;border-radius:4px}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;overflow-x:auto}
.board .col{background:var(--ink-100);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.board .col h4{font-size:13px;display:flex;justify-content:space-between}
.board .tk{background:#fff;border:1px solid var(--ink-200);border-radius:12px;padding:9px 10px;font-size:12.5px;text-align:left;display:flex;flex-direction:column;gap:4px}

/* asistente */
.wiz{display:flex;flex-wrap:wrap;gap:6px}
.wiz button{display:flex;align-items:center;gap:8px;border:1px solid var(--ink-200);background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-700)}
.wiz button em{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink-100);font-size:12px;font-weight:700}
.wiz button[aria-current="step"]{border-color:var(--rose-500);background:var(--rose-50);color:var(--ink-950)}
.wiz button[aria-current="step"] em{background:var(--rose-500);color:#fff}
.wiz button.okk em{background:var(--ok);color:#fff}
.wiz button.ko em{background:var(--warn);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink-800)}
.fld .hint{font-size:12px;color:var(--ink-600)}
.fld .err{font-size:12.5px;color:var(--bad);font-weight:600}
.in{height:38px;border:1px solid var(--ink-300);border-radius:11px;padding:0 10px;background:#fff;width:100%}
textarea.in{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.in[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px rgba(179,38,30,.12)}
.in[readonly]{background:var(--ink-100)}
.req::after{content:" *";color:var(--bad)}
.check{display:flex;flex-direction:column;gap:0}
.check .it{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ink-200);font-size:13.5px}
.check .it:last-child{border-bottom:0}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.prog td input{width:84px;height:30px;border:1px solid var(--ink-300);border-radius:8px;padding:0 6px;text-align:right;font-family:'JetBrains Mono';font-size:12px}
.prog td.miss{color:var(--bad);font-weight:700}

/* modales */
.scrim{position:fixed;inset:0;background:rgba(25,17,19,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:22px;width:min(720px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal>header{padding:18px 22px 8px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.modal>header h2{font-size:19px}
.modal>header p{margin:4px 0 0;font-size:13px;color:var(--ink-600)}
.modal .x{border:0;background:var(--ink-100);width:32px;height:32px;border-radius:50%;font-size:15px;flex:none}
.modal .bd{padding:8px 22px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal>footer{padding:12px 22px;border-top:1px solid var(--ink-200);display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;background:var(--ink-50)}
.modal>footer .lft{margin-right:auto;font-size:12.5px;color:var(--ink-600)}
fieldset.grpf{border:1px solid var(--ink-200);border-radius:14px;padding:10px 14px 14px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
fieldset.grpf legend{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-600);padding:0 6px}
.files{display:flex;flex-direction:column;gap:6px;grid-column:1/-1}
.file{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--ink-200);border-radius:10px;padding:6px 10px}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{display:flex;flex-direction:column;gap:6px}
.pick button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--ink-200);background:#fff;border-radius:12px;padding:10px 12px}
.pick button:hover:not(:disabled){border-color:var(--rose-300)}
.pick button span{flex:1}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink-950);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .2s;z-index:80;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:#fff;z-index:70;box-shadow:-10px 0 40px rgba(25,17,19,.2);transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer>header{padding:18px 20px;border-bottom:1px solid var(--ink-200);display:flex;justify-content:space-between;align-items:center}
.drawer .in2{padding:16px 20px 40px;overflow:auto;display:flex;flex-direction:column;gap:12px;font-size:13.5px}
.drawer h3{font-size:15px;margin-top:6px}
.drawer ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.drawer table td,.drawer table th{white-space:normal;padding:6px 8px;font-size:12.5px}
@media (max-width:820px){
  .side{display:none}
  .app{padding:8px}
  .main{padding:18px 14px 40px;border-radius:20px}
  .proto{position:static}
  .prow{grid-template-columns:1fr 1fr}
  .prow>div:first-child{grid-column:1/-1}
  .act .top{grid-template-columns:1fr auto}
  .act .top>.bw{grid-column:1/-1}
  .act .top>.rsp{display:none}
  .board{grid-template-columns:repeat(4,78%)}
}
</style>
</head>
<body>
<div class="proto" role="region" aria-label="Controles del prototipo">
  <b>Prototipo · Proyectos v2</b>
  <div class="grp">Ver como
    <div class="seg" id="roleSeg"><button data-role="coord" aria-pressed="true">Coordinadora</button><button data-role="ger" aria-pressed="false">Gerencia</button></div>

/* ───────── Reglas (iguales a las de la PO) ───────── */
const entOk=e=>e.cant>=e.meta&&e.med>=1;
const allEnt=a=>a.ents.length>0&&a.ents.every(entOk);
const live=a=>a.reps.filter(r=>!r.void);
const last=a=>{const l=live(a);return l.length?l[l.length-1].p:null;};
const avgEnt=a=>a.ents.length?a.ents.reduce((s,e)=>s+Math.min(e.cant/e.meta,1),0)/a.ents.length*100:0;
function prog(a){
  if(S.u22&&a.hitos){const d=a.hitos.filter(h=>h[1]).length;const p=Math.round(d/a.hitos.length*100);return allEnt(a)?100:Math.min(p,TOPE);}
  if(allEnt(a))return 100;
  const l=last(a);return Math.round(l==null?avgEnt(a):Math.max(l,avgEnt(a)));}
function plan(a){if(WEEK<a.w[0])return 0;if(WEEK>=a.w[1])return TOPE;return Math.min(TOPE,Math.round((WEEK-a.w[0]+1)/(a.w[1]-a.w[0]+1)*100));}
function estado(a){if(allEnt(a))return 'Terminada';const p=prog(a);if(WEEK>a.w[1]&&p<TOPE)return 'Atrasada';if(live(a).length||(S.u22&&a.hitos&&a.hitos.some(h=>h[1])))return 'En curso';return 'Sin iniciar';}
const EST={Terminada:'t-ok','En curso':'t-info',Atrasada:'t-bad','Sin iniciar':'t-ink'};
const peso=a=>a.w[1]-a.w[0]+1;
function projReal(){let t=0,s=0;ACTS.forEach(a=>{t+=peso(a);s+=prog(a)*peso(a);});return Math.round(s/t);}
function projPlan(){let t=0,s=0;ACTS.forEach(a=>{t+=peso(a);s+=plan(a)*peso(a);});return Math.round(s/t);}
const frozen=()=>S.pst!=='EJECUCION';
const isGer=()=>S.role==='ger';
const canReport=a=>!frozen()&&(isGer()||a.resp===ME[S.role]);
const total=g=>g.sub+g.iva;
const canValidate=g=>isGer()&&!frozen()&&g.st==='REGISTRADO'&&g.by!==ME.ger&&g.sop.length>0;
function whyNoValidate(g){if(!isGer())return 'Solo Administración o Gerencia validan gastos';if(frozen())return 'El proyecto está congelado';if(g.by===ME.ger)return 'Nadie valida su propio gasto';if(!g.sop.length)return 'Sin soporte no se puede validar';return '';}
function semOf(l){return {ok:['En rango',C.ok],warn:['Atención',C.warn],bad:['Crítico',C.bad]}[l];}
function techLevel(){const r=projReal(),p=projPlan();const late=ACTS.filter(a=>estado(a)==='Atrasada').length;return (p-r>=10)?'bad':(late||p-r>=4)?'warn':'ok';}

/* ───────── Piezas ───────── */
function bar(real,pl,color){return `<div class="bar" title="Real ${real} % · plan ${pl} % · tope ${TOPE} %"><i style="width:${real}%;background:${color||C.r5}"></i><u style="left:${TOPE}%"></u><b style="left:calc(${pl}% - 1px)"></b></div>`;}
function sem(l,txt){const m=semOf(l);return `<span class="tag" style="background:${m[1]}1A;color:${m[1]}"><span class="dot" style="background:${m[1]}"></span>${txt||m[0]}</span>`;}
function stTag(st){return {EJECUCION:'<span class="tag t-info">En ejecución</span>',BORRADOR:'<span class="tag t-warn">Borrador</span>',SUSPENDIDO:'<span class="tag t-ink">Suspendido</span>',CERRADO:'<span class="tag t-ink">Cerrado</span>',CANCELADO:'<span class="tag t-bad">Cancelado</span>'}[st];}
function gTag(g){return {REGISTRADO:g.sop.length?'<span class="tag t-warn">Por validar</span>':'<span class="tag t-bad">Sin soporte</span>',VALIDADO:'<span class="tag t-ok">Validado</span>',RECHAZADO:'<span class="tag t-bad">Rechazado</span>',ANULADO:'<span class="tag t-ink">Anulado</span>'}[g.st];}
function kpi(l,v,d,alert,go){return `<button class="kpi${alert?' alert':''}" ${go?`data-go="${go}"`:''}><span class="l">${l}</span><span class="v">${v}</span>${d?`<span class="d">${d}</span>`:''}</button>`;}

function myTodo(){const L=[];
  if(isGer()){
    const ok=GASTOS.filter(canValidate).length, own=GASTOS.filter(g=>g.st==='REGISTRADO'&&g.by===ME.ger).length, nos=GASTOS.filter(g=>g.st==='REGISTRADO'&&!g.sop.length).length;
    if(ok)L.push([`<b>${ok} gasto${ok>1?'s':''}</b> de PRY-2026-002 espera${ok>1?'n':''} tu validación${own?` · ${own} es tuyo y lo valida otra persona`:''}${nos?` · ${nos} sin soporte`:''}.`,'Validar','go:ficha:finanzas:gastos']);
    const pm=MODS.filter(m=>m.st==='PENDIENTE').length;if(pm)L.push([`<b>${pm} solicitud de modificación</b> pendiente en PRY-2026-002.`,'Revisar','go:ficha:historial:mods']);
    if(!DRAFT.approved)L.push([`<b>PRY-2026-007</b> está en borrador: ${missing().length?`faltan ${missing().length} requisitos para aprobar la línea base`:'lista para aprobar la línea base'}.`,missing().length?'Ver qué falta':'Aprobar','go:wizard:5']);
    L.push(['<b>2 proyectos en Crítico</b>: PRY-2026-004 y PRY-2026-006.','Ver','filter:bad']);
  } else {
    ACTS.filter(a=>a.resp===ME.coord&&estado(a)==='Atrasada').forEach(a=>L.push([`<b>${a.n}</b> está atrasada: va en ${prog(a)} % y cerró el ${fdate('2026-11-01')}.`,'Registrar avance','avance:'+a.id]));
    ACTS.filter(a=>a.resp===ME.coord&&estado(a)==='En curso').forEach(a=>{const l=live(a);const dd=l.length?Math.round((new Date(TODAY)-new Date(l[l.length-1].f))/864e5):0;if(dd>=10)L.push([`<b>${a.n}</b>: tu último reporte fue hace ${dd} días.`,'Registrar avance','avance:'+a.id]);});
    GASTOS.filter(g=>g.by===ME.coord&&g.st==='REGISTRADO'&&!g.sop.length).forEach(g=>L.push([`Gasto <b>${g.d}</b> sin soporte: no se puede validar.`,'Adjuntar soporte','adj:'+g.id]));
    GASTOS.filter(g=>g.by===ME.coord&&g.st==='RECHAZADO').forEach(g=>L.push([`Gasto <b>${g.d}</b> rechazado: «${g.mot}»`,'Corregir','fix:'+g.id]));
    if(!DRAFT.approved)L.push([`<b>PRY-2026-007</b> sigue en borrador: ${missing().length?`faltan ${missing().length} requisitos`:'todo listo; falta que Gerencia apruebe'}.`,'Continuar','go:wizard:'+(missing().length?missing()[0][3]:5)]);
  }
  if(frozen())L.unshift([`PRY-2026-002 está <b>${S.pst==='SUSPENDIDO'?'suspendido':'cerrado'}</b>: no se registran avances ni gastos.`,'Ver ficha','go:ficha:resumen']);
  return L;}

  h+='<div class="plist">'+(rows.length?rows.map(p=>{
    const target=p.c==='PRY-2026-002'?'ficha:resumen':p.c==='PRY-2026-007'&&!DRAFT.approved?'wizard:1':'none';
    if(p.st==='BORRADOR'){const m=missing().length;return `<button class="prow" data-go="${target}"><div><span class="cd">${p.c}</span><div class="nm">${p.n}</div><span class="muted">${p.cli}</span></div><div>${stTag(p.st)}</div><div style="grid-column:span 2"><span class="lbl">Para aprobar la línea base</span>${m?`<span class="warn">Faltan ${m} de 6 requisitos</span>`:'<span class="good">Listo para aprobar</span>'}</div><div class="nx">Responsable: ${p.resp}</div></button>`;}

function draftSum(){return DRAFT.rub.reduce((s,r)=>s+r.a,0);}
function missing(){const M=[];
  if(!(DRAFT.valor>0)||!DRAFT.ini||!DRAFT.fin||DRAFT.fin<DRAFT.ini)M.push(['Valor total y fechas','El valor debe ser mayor que 0 y la fecha fin posterior al inicio.','Datos generales',1]);
  if(!(DRAFT.benef>0))M.push(['Meta de beneficiarios','Escribe cuántas personas espera atender el proyecto (hoy está en 0).','Datos generales',1]);
  const noEnt=[];DRAFT.objs.forEach(o=>o.acts.forEach(a=>{if(!a.ents.length)noEnt.push(a.n);}));
  if(!DRAFT.objs.length||noEnt.length)M.push(['Objetivos, actividades y entregables',noEnt.length?`Cada actividad necesita al menos un entregable. Falta en: ${noEnt.join(', ')}.`:'Agrega al menos un objetivo.','Estructura',2]);
  if(draftSum()!==DRAFT.valor)M.push(['Presupuesto = valor total',`El total asignado es ${mill(draftSum())} y el valor total es ${mill(DRAFT.valor)}: ${draftSum()<DRAFT.valor?'faltan':'sobran'} ${mill(Math.abs(DRAFT.valor-draftSum()))}.`,'Presupuesto',4]);
  const bad=DRAFT.rub.filter(r=>r.p.reduce((s,v)=>s+v,0)!==r.a);if(bad.length)M.push(['Programación mensual cuadrada',bad.map(r=>`${r.n}: falta programar ${mill(r.a-r.p.reduce((s,v)=>s+v,0))}`).join(' · '),'Presupuesto',4]);
  return M;}

  if(st===4){const sum=draftSum();h+=`<section class="card"><h3>Presupuesto <small>total asignado ${mill(sum)} de ${mill(DRAFT.valor)}</small></h3>${sum!==DRAFT.valor?`<div class="banner warn"><span>⚠</span><span>${sum<DRAFT.valor?'Faltan':'Sobran'} <b>${mill(Math.abs(DRAFT.valor-sum))}</b> para igualar el valor total. Ajusta un rubro o <button class="link" data-act="usesum">usa la suma como valor total</button>.</span></div>`:'<div class="banner ok"><span>✓</span><span>El total asignado es igual al valor total.</span></div>'}
    <div class="tbl prog"><table><thead><tr><th>Rubro</th><th class="num">Asignado (M)</th>${DRAFT.months.map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Falta por programar</th><th></th></tr></thead><tbody>${DRAFT.rub.map((r,ri)=>{const f=r.a-r.p.reduce((s,v)=>s+v,0);return `<tr><td class="strong">${r.c} · ${r.n}</td><td class="num"><input type="number" data-ra="${ri}" value="${r.a}" aria-label="Asignado ${r.n}"></td>${r.p.map((v,mi)=>`<td class="num"><input type="number" data-rp="${ri}:${mi}" value="${v}" aria-label="${r.n} ${DRAFT.months[mi]}"></td>`).join('')}<td class="num ${f?'miss':''}">${f?mill(f):'<span class="good">$ 0</span>'}</td><td>${f?`<button class="btn sm" data-split="${ri}">Repartir en partes iguales</button>`:''}</td></tr>`;}).join('')}<tr class="tot"><td>Total</td><td class="num">${sum}</td>${DRAFT.months.map((_,mi)=>`<td class="num">${DRAFT.rub.reduce((s,r)=>s+r.p[mi],0)}</td>`).join('')}<td></td><td></td></tr></tbody></table></div>
    <div class="acts"><button class="link" data-toast="Se abre el catálogo de rubros R01 a R15">+ Agregar rubro</button><span style="flex:1"></span><button class="btn pri" data-act="savebud">Guardar presupuesto y programación</button></div></section>`;}
  if(st===5){const ok=M.length===0;h+=`<section class="card"><h3>Para aprobar la línea base <small>${6-M.length} de 6 listos</small></h3><p class="sub">Es lo mismo que revisa el sistema al aprobar; aquí lo ves antes.</p><div class="check">${REQS.map(r=>{const m=M.find(x=>x[0]===r);return `<div class="it"><span class="ic" style="background:${m?C.warn:C.ok}">${m?'!':'✓'}</span><span><span class="strong">${r}</span>${m?`<br><span class="muted" style="font-size:12.5px">${m[1]}</span>`:''}</span>${m?`<button class="btn sm" data-wstep="${m[3]}">Corregir aquí</button>`:''}</div>`;}).join('')}</div>${DRAFT.ini<TODAY?'<div class="banner warn"><span>⚠</span><span>La fecha de inicio ya pasó: el proyecto nacerá atrasado. No bloquea la aprobación.</span></div>':''}

  if(st<5)h+=`<div class="acts"><button class="btn" data-wstep="${Math.max(1,st-1)}" ${st===1?'disabled':''}>← Anterior</button><span style="flex:1"></span><button class="btn pri" data-wstep="${st+1}">Siguiente →</button></div>`;
  return h;}

/* ───────── Render ───────── */
function render(){const m=$('#main');
  m.innerHTML=S.screen==='portafolio'?viewPortafolio():S.screen==='ficha'?viewFicha():viewWizard();
  document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  document.querySelectorAll('#stSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===S.pst));
  document.querySelectorAll('#u22Seg button').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.u22==='1')===S.u22));}
function go(t){const p=t.split(':');S.menu=false;
  if(p[0]==='portafolio'){S.screen='portafolio';}
  else if(p[0]==='ficha'){S.screen='ficha';if(p[1])S.tab=p[1];if(p[2]){if(S.tab==='finanzas'){S.fin=p[2];if(p[2]==='gastos')S.gfilter='pendientes';}if(S.tab==='historial')S.hist=p[2];}}
  else if(p[0]==='wizard'){if(DRAFT.approved){toast('PRY-2026-007 ya está en ejecución');return;}S.screen='wizard';DRAFT.step=+p[1]||1;}
  else if(p[0]==='none'){toast('En el prototipo solo se abren PRY-2026-002 y el borrador PRY-2026-007');return;}
  render();window.scrollTo({top:0,behavior:'smooth'});}

const M={dirty:false,busy:false,onClose:null};
function openModal(html){M.dirty=false;M.busy=false;$('#modal').innerHTML=html;$('#scrim').classList.add('on');S.menu=false;const f=$('#modal').querySelector('input:not([readonly]),select,textarea,button:not(.x)');if(f)f.focus();}
function tryClose(){if(M.busy)return;if(M.dirty){const ft=$('#modal footer');if(ft&&!ft.querySelector('.confirm')){ft.insertAdjacentHTML('afterbegin','<span class="lft confirm"><b>¿Descartar los cambios?</b> <button class="link" data-x="discard">Descartar</button> · <button class="link" data-x="keep">Seguir editando</button></span>');}return;}closeModal();}
function closeModal(){$('#scrim').classList.remove('on');M.dirty=false;}
function busy(btn,ms,fn){M.busy=true;const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> Guardando…';$('#modal').querySelectorAll('[data-close],.x').forEach(b=>b.disabled=true);setTimeout(()=>{M.busy=false;M.dirty=false;closeModal();fn();btn.innerHTML=old;},ms);}
function mHead(t,s){return `<header><div><h2 id="mT">${t}</h2>${s?`<p>${s}</p>`:''}</div><button class="x" data-close aria-label="Cerrar">✕</button></header>`;}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2800);}

function avanceModal(id){const a=ACTS.find(x=>x.id===id);const l=last(a);const comp=allEnt(a);

   <div class="fld"><label>Medios de verificación (opcional)</label><div class="files" id="fl"></div><div class="acts"><button class="btn sm" data-addfile="acta-taller.pdf">Adjuntar archivo</button><button class="btn sm" data-addlink="1">Agregar enlace</button></div><span class="hint">Puedes adjuntar varios archivos o enlaces. Los soportes de entregables se registran en «Registrar entregable».</span></div>
