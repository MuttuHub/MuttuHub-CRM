name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      # Disposable, empty Postgres for this job only — torn down with the
      # runner. There is no separate "dev" database in this project (the only
      # real Supabase instance is production), so prisma/invariant.test.ts
      # must never point at it from CI; this service is what it hits instead.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the ephemeral CI database
        run: npx prisma migrate deploy

      - name: Generate Prisma client (needed by catalogs tests)
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The invariant files open a live connection and run DDL/DML. Two of them
      # in parallel can deadlock on Postgres (40P01, seen on 2026-10-20), so
      # they run alone and after the rest of the suite.
      # Same scope as before (src + scripts) plus the coverage floor in
      # vitest.config.ts; the report lands in coverage/ for the upload below.
      - name: Unit tests with coverage floor (Vitest)
        run: npm run test:coverage

      - name: Live-DB invariants (Vitest, no file parallelism)
        run: npx vitest run prisma --no-file-parallelism

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
