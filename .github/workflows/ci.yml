name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      # Disposable, empty Postgres for this job only — torn down with the
      # runner. There is no separate "dev" database in this project (the only
      # real Supabase instance is production), so prisma/invariant.test.ts
      # must never point at it from CI; this service is what it hits instead.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to the ephemeral CI database
        run: npx prisma migrate deploy

      - name: Generate Prisma client (needed by catalogs tests)
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The invariant files open a live connection and run DDL/DML. Two of them
      # in parallel can deadlock on Postgres (40P01, seen on 2026-10-20), so
      # they run alone and after the rest of the suite.
      # Same scope as before (src + scripts) plus the coverage floor in
      # vitest.config.ts; the report lands in coverage/ for the upload below.
      - name: Unit tests with coverage floor (Vitest)
        run: npm run test:coverage

      - name: Live-DB invariants (Vitest, no file parallelism)
        run: npx vitest run prisma --no-file-parallelism

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # E1: the Playwright suite against the production build and a seeded local
  # Supabase (Postgres + Auth + Storage) started inside the runner. Nothing
  # here reaches a remote environment and no repository secret is needed: the
  # keys come from `supabase status` and die with the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_STORAGE_BUCKET: muttu-docs
      ENABLE_DEV_ROUTES: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Postgres, Auth, Storage)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Export the local Supabase keys
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      - name: Create the storage bucket
        run: |
          curl -fsS -X POST "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/bucket" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$SUPABASE_STORAGE_BUCKET\",\"name\":\"$SUPABASE_STORAGE_BUCKET\",\"public\":false}"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Same order as scripts/seed-demo-flujo.ts documents: base seed, then the
      # S11 projects, then the flow demo (flujo before projects breaks it).
      - name: Seed the demo data
        run: |
          npx prisma db seed
          npx tsx scripts/seed-projects-demo.ts --apply
          npx tsx scripts/seed-demo-flujo.ts --apply

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E suite (Playwright)
        run: npx playwright test --config playwright.ci.config.ts

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ci
          path: |
            playwright-report-ci/
            test-results-ci/
          if-no-files-found: ignore

  # E1: the Playwright suite against the production build and a seeded local
  # Supabase (Postgres + Auth + Storage) started inside the runner. Nothing
  # here reaches a remote environment and no repository secret is needed: the
  # keys come from `supabase status` and die with the runner.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_STORAGE_BUCKET: muttu-docs
      ENABLE_DEV_ROUTES: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Postgres, Auth, Storage)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Export the local Supabase keys
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      - name: Create the storage bucket
        run: |
          curl -fsS -X POST "$NEXT_PUBLIC_SUPABASE_URL/storage/v1/bucket" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$SUPABASE_STORAGE_BUCKET\",\"name\":\"$SUPABASE_STORAGE_BUCKET\",\"public\":false}"

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Same order as scripts/seed-demo-flujo.ts documents: base seed, then the
      # S11 projects, then the flow demo (flujo before projects breaks it).
      - name: Seed the demo data
        run: |
